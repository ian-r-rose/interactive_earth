[workspace]
name = "interactive_earth"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
cxx-compiler = "*"
make = "*"
pkg-config = "*"
fftw = "3.3.*"
# Temporary: only needed until the sokol_app port.
sdl2 = "*"
glew = "*"

[target.linux-64.dependencies]
libgl-devel = "*"

[tasks]
# Legacy Makefile build of the windowed app (removed once CMake lands).
build-legacy = 'make -f Makefile.linux INCLUDE_DIRS="-I$CONDA_PREFIX/include" LIBRARY_DIRS="-L$CONDA_PREFIX/lib -Wl,-rpath,$CONDA_PREFIX/lib"'
# Temporary headless baseline harness (superseded by ie_bench).
build-baseline = 'mkdir -p build && g++ -O3 -fopenmp -I$CONDA_PREFIX/include bench/baseline_bench.cpp convection.cpp -o build/baseline_bench -L$CONDA_PREFIX/lib -Wl,-rpath,$CONDA_PREFIX/lib -lfftw3'
baseline = { cmd = "build/baseline_bench", depends-on = ["build-baseline"] }
